name: lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-fmt:
    name: Check cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-05-14
          components: rustfmt
      - name: Run check
        run: cargo +nightly-2025-05-14 fmt -- --check --unstable-features --config imports_granularity=Module,group_imports=StdExternalCrate

  check-clippy-all-features:
    name: Check cargo clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      - name: Run check
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Check clippy without features, helps to catch missing feature configurations
  check-clippy-no-features:
    name: Check cargo clippy (no features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      - name: Run check
        run: cargo clippy --all-targets -- -D warnings
