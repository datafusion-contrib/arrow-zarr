[workspace]
members = ["crates/spatialchunk", "crates/spatialchunk-python"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Maxime Dion <maxdion@gmail.com>"]
repository = "https://github.com/maximedion2/spatialchunk"
homepage = "https://github.com/maximedion2/spatialchunk"

[workspace.dependencies]
spatialchunk = { path = "crates/spatialchunk" }

# Arrow deps
arrow = { version = "58.3.0" }
arrow-array = { version = "58.3.0" }
arrow-schema = { version = "58.3.0" }
datafusion = { version = "54.1.0" }
tokio = { version = "1.46.1", features = ["rt", "macros", "net", "rt-multi-thread"] }
